services:
  db:
    image: postgres:16
    container_name: iam-postgres
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: iam-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: iam-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/iam_db
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - db
      - redis